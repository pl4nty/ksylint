[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "ksylint"
version = "1.0.0.dev0"
description = "Linter and formatter for Kaitai Struct .ksy files, following the official KSY style guide."
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Jonas Plum" }]
maintainers = [{ name = "pl4nty" }]
requires-python = ">=3.9"
keywords = ["kaitai", "kaitai-struct", "ksy", "linter", "yaml", "style-guide"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "PyYAML>=5.4",
    "jsonschema>=4.0",
    "license-expression>=30.0",
    "tomli>=1.1; python_version < '3.11'",
]

[project.optional-dependencies]
test = ["pytest>=7"]
dev = ["pytest>=7", "ruff>=0.5", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/pl4nty/ksylint"
Source = "https://github.com/pl4nty/ksylint"
Issues = "https://github.com/pl4nty/ksylint/issues"
"Style guide" = "https://doc.kaitai.io/ksy_style_guide.html"

[tool.hatch.build.targets.wheel]
packages = ["ksylint"]

[tool.hatch.build.targets.sdist]
include = ["ksylint", "test", "scripts", "README.md", "LICENSE", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["test"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF012", "UP007", "UP045"]
